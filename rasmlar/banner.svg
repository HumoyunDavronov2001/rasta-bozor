<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="RASTA — bozorlarni raqamlashtirish platformasi">
  <defs>
    <linearGradient id="fon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08140f"/>
      <stop offset="1" stop-color="#0f2419"/>
    </linearGradient>
    <pattern id="tor" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#173024" stroke-width="1"/>
    </pattern>
    <style>
      .sarlavha{font:800 58px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#f8fafc;letter-spacing:2px}
      .izoh{font:500 22px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#9fb8ab}
      .teg{font:600 15px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#cfe3d8}
      .r{font:700 10px 'DejaVu Sans Mono',Consolas,monospace;fill:#e8f5ee}
      .b{font:700 12px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#9fb8ab}
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#fon)"/>
  <rect width="1280" height="360" fill="url(#tor)" opacity=".6"/>

  <g transform="translate(64 0)">
    <g transform="translate(0 70)">
      <rect width="56" height="56" rx="14" fill="#13704a"/>
      <path d="M12 24h32l-3-9H15z" fill="#e8f5ee"/>
      <rect x="15" y="26" width="26" height="17" rx="2" fill="none" stroke="#e8f5ee" stroke-width="3"/>
      <rect x="24" y="32" width="8" height="11" fill="#e8f5ee"/>
    </g>
    <text class="sarlavha" x="0" y="190">RASTA</text>
    <text class="izoh" x="0" y="232">Bozorlarni raqamlashtirish: rasta · ijara · to'lov · plan</text>
    <g transform="translate(0 270)">
      <rect width="86" height="30" rx="15" fill="#173024"/><text class="teg" x="43" y="20" text-anchor="middle">Next.js</text>
      <rect x="96" width="96" height="30" rx="15" fill="#173024"/><text class="teg" x="144" y="20" text-anchor="middle">React 19</text>
      <rect x="202" width="96" height="30" rx="15" fill="#173024"/><text class="teg" x="250" y="20" text-anchor="middle">Tailwind</text>
      <rect x="308" width="84" height="30" rx="15" fill="#173024"/><text class="teg" x="350" y="20" text-anchor="middle">Python</text>
      <rect x="402" width="84" height="30" rx="15" fill="#173024"/><text class="teg" x="444" y="20" text-anchor="middle">SQLite</text>
      <rect x="496" width="58" height="30" rx="15" fill="#173024"/><text class="teg" x="525" y="20" text-anchor="middle">QR</text>
    </g>
  </g>

  <!-- Bozor plani (SVG) -->
  <g transform="translate(720 52)">
    <rect width="360" height="256" rx="14" fill="#0b1a12" stroke="#1f3d2d" stroke-width="2"/>
    <text class="b" x="18" y="28">Sabzavot qatori</text>
    <text class="b" x="18" y="132">Meva qatori</text>
    <!-- 1-qator -->
    <g>
      <rect x="18" y="40" width="44" height="30" rx="4" fill="#13704a"/><text class="r" x="40" y="59" text-anchor="middle">SA-01</text>
      <rect x="68" y="40" width="44" height="30" rx="4" fill="#13704a"/><text class="r" x="90" y="59" text-anchor="middle">SA-02</text>
      <rect x="118" y="40" width="44" height="30" rx="4" fill="#24382d">
        <animate attributeName="fill" values="#24382d;#24382d;#13704a;#13704a;#24382d" keyTimes="0;0.35;0.4;0.95;1" dur="7s" repeatCount="indefinite"/>
      </rect><text class="r" x="140" y="59" text-anchor="middle">SA-03</text>
      <rect x="168" y="40" width="44" height="30" rx="4" fill="#13704a"/><text class="r" x="190" y="59" text-anchor="middle">SA-04</text>
      <rect x="218" y="40" width="44" height="30" rx="4" fill="#1d3a6b"/><text class="r" x="240" y="59" text-anchor="middle">SA-05</text>
      <rect x="268" y="40" width="44" height="30" rx="4" fill="#13704a"/><text class="r" x="290" y="59" text-anchor="middle">SA-06</text>
      <rect x="18" y="76" width="44" height="30" rx="4" fill="#24382d"/><text class="r" x="40" y="95" text-anchor="middle">SA-07</text>
      <rect x="68" y="76" width="44" height="30" rx="4" fill="#13704a"/><text class="r" x="90" y="95" text-anchor="middle">SA-08</text>
      <rect x="118" y="76" width="44" height="30" rx="4" fill="#13704a"/><text class="r" x="140" y="95" text-anchor="middle">SA-09</text>
      <rect x="168" y="76" width="44" height="30" rx="4" fill="#3b3b33"/><text class="r" x="190" y="95" text-anchor="middle">SA-10</text>
    </g>
    <!-- sudralayotgan rasta -->
    <rect x="218" y="76" width="44" height="30" rx="4" fill="none" stroke="#4d6b5b" stroke-width="1.5" stroke-dasharray="4 3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.58;0.95;0.97;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;50 0;50 0;0 0" keyTimes="0;0.55;0.7;0.95;1" dur="7s" repeatCount="indefinite"/>
      <rect x="218" y="76" width="44" height="30" rx="4" fill="#13704a" stroke="#e8f5ee" stroke-width="0">
        <animate attributeName="stroke-width" values="0;0;2;2;0;0" keyTimes="0;0.52;0.55;0.72;0.75;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text class="r" x="240" y="95" text-anchor="middle">SA-11</text>
    </g>
    <!-- 2-qator -->
    <g>
      <rect x="18" y="144" width="56" height="38" rx="4" fill="#13704a"/><text class="r" x="46" y="167" text-anchor="middle">ME-01</text>
      <rect x="80" y="144" width="56" height="38" rx="4" fill="#13704a"/><text class="r" x="108" y="167" text-anchor="middle">ME-02</text>
      <rect x="142" y="144" width="56" height="38" rx="4" fill="#24382d"/><text class="r" x="170" y="167" text-anchor="middle">ME-03</text>
      <rect x="204" y="144" width="56" height="38" rx="4" fill="#13704a"/><text class="r" x="232" y="167" text-anchor="middle">ME-04</text>
      <rect x="266" y="144" width="56" height="38" rx="4" fill="#13704a"/><text class="r" x="294" y="167" text-anchor="middle">ME-05</text>
      <rect x="18" y="190" width="56" height="38" rx="4" fill="#1d3a6b"/><text class="r" x="46" y="213" text-anchor="middle">ME-06</text>
      <rect x="80" y="190" width="56" height="38" rx="4" fill="#13704a"/><text class="r" x="108" y="213" text-anchor="middle">ME-07</text>
      <rect x="142" y="190" width="56" height="38" rx="4" fill="#13704a"/><text class="r" x="170" y="213" text-anchor="middle">ME-08</text>
      <rect x="204" y="190" width="56" height="38" rx="4" fill="#24382d"/><text class="r" x="232" y="213" text-anchor="middle">ME-09</text>
    </g>
  </g>

  <!-- Telefon: QR to'lov -->
  <g transform="translate(1104 70)">
    <rect width="122" height="224" rx="18" fill="#e8f5ee"/>
    <rect x="8" y="16" width="106" height="192" rx="10" fill="#0b1a12"/>
    <text x="61" y="40" text-anchor="middle" style="font:700 12px 'Segoe UI',Inter,sans-serif;fill:#e8f5ee">SA-03</text>
    <g transform="translate(29 52)" fill="#e8f5ee">
      <rect width="64" height="64" fill="#e8f5ee"/>
      <g fill="#0b1a12">
        <rect x="4" y="4" width="18" height="18"/><rect x="42" y="4" width="18" height="18"/><rect x="4" y="42" width="18" height="18"/>
        <rect x="9" y="9" width="8" height="8" fill="#e8f5ee"/><rect x="47" y="9" width="8" height="8" fill="#e8f5ee"/><rect x="9" y="47" width="8" height="8" fill="#e8f5ee"/>
        <rect x="28" y="6" width="6" height="6"/><rect x="28" y="20" width="6" height="6"/><rect x="34" y="30" width="6" height="6"/>
        <rect x="26" y="40" width="6" height="6"/><rect x="44" y="34" width="6" height="6"/><rect x="50" y="46" width="6" height="6"/>
        <rect x="38" y="52" width="6" height="6"/><rect x="28" y="54" width="6" height="6"/>
      </g>
    </g>
    <rect x="16" y="130" width="90" height="26" rx="13" fill="#13704a" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.95;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="61" y="148" text-anchor="middle" opacity="0" style="font:700 12px 'Segoe UI',Inter,sans-serif;fill:#e8f5ee">To'landi ✓
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.95;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="61" y="186" text-anchor="middle" style="font:800 15px 'Segoe UI',Inter,sans-serif;fill:#9fb8ab">410 000</text>
    <text x="61" y="200" text-anchor="middle" style="font:600 10px 'Segoe UI',Inter,sans-serif;fill:#9fb8ab">so'm / oy</text>
  </g>
</svg>
